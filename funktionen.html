<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funktionsgraphen - Mathe Hilfe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="graph-page">
        <h1>Funktionsgraph</h1>
        <p>Gib eine Funktion mit <strong>m</strong> und <strong>b</strong> ein und verändere ihre Parameter.</p>

        <div class="controls">
            <label for="function-input">f(x) =</label>
            <input id="function-input" type="text" value="m*x+b" autocomplete="off"
                aria-label="Mathematische Funktion">
            <label for="slope-slider">Steigung m = <output id="slope-value">1.00</output></label>
            <input id="slope-slider" type="range" min="-10" max="10" step="0.1" value="1"
                aria-label="Steigung">
            <label for="intercept-slider">y-Achsenabschnitt b = <output id="intercept-value">0.00</output></label>
            <input id="intercept-slider" type="range" min="-10" max="10" step="0.1" value="0"
                aria-label="y-Achsenabschnitt">
        </div>

        <p id="message" role="status"></p>
        <canvas id="graph" width="800" height="520" aria-label="Koordinatensystem mit Funktionsgraph"></canvas>
        <p><a href="index.html">Zur Startseite</a></p>
    </main>
    <script src="script.js"></script>
</body>

</html>
